<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOCUSCRAFT — Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts: Space Mono + Syne -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- jQuery UI (sortable) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/base/jquery-ui.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
  </head>
  <body>
    <!-- ── BACKGROUND GRID ── -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <canvas id="particle-canvas"></canvas>

    <!-- ── HEADER ── -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">◎</span>
        <span class="logo-text">FOCUSCRAFT</span>
      </div>
      <div class="header-controls">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">
          <span class="theme-icon">◐</span>
        </button>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
        <button
          id="clear-data-btn"
          class="icon-btn danger"
          title="Clear all data"
        >
          ⊗
        </button>
      </div>
    </header>

    <!-- ── MAIN LAYOUT ── -->
    <main class="app-main">
      <!-- LEFT: TIMER COLUMN -->
      <section class="timer-column">
        <!-- Session type tabs -->
        <div class="session-tabs">
          <button class="tab-btn active" data-mode="work">WORK</button>
          <button class="tab-btn" data-mode="short-break">SHORT BREAK</button>
          <button class="tab-btn" data-mode="long-break">LONG BREAK</button>
        </div>

        <!-- Timer ring -->
        <div class="timer-ring-wrapper">
          <svg
            class="timer-svg"
            viewBox="0 0 280 280"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- Track ring -->
            <circle class="ring-track" cx="140" cy="140" r="120" />
            <!-- Progress ring -->
            <circle
              class="ring-progress"
              id="ring-progress"
              cx="140"
              cy="140"
              r="120"
              stroke-dasharray="753.98"
              stroke-dashoffset="0"
              transform="rotate(-90 140 140)"
            />
            <!-- Tick marks -->
            <g class="tick-marks" id="tick-marks"></g>
          </svg>

          <!-- Timer display -->
          <div class="timer-display">
            <div class="timer-digits" id="timer-digits">25:00</div>
            <div class="timer-label" id="timer-label">FOCUS SESSION</div>
            <div class="session-count">
              <span class="session-pips" id="session-pips"></span>
            </div>
          </div>
        </div>

        <!-- Controls -->
        <div class="timer-controls">
          <button class="ctrl-btn secondary" id="reset-btn" title="Reset">
            ↺
          </button>
          <button class="ctrl-btn primary" id="start-btn">START</button>
          <button class="ctrl-btn secondary" id="skip-btn" title="Skip session">
            ⇥
          </button>
        </div>

        <!-- Active task indicator -->
        <div class="active-task-bar" id="active-task-bar">
          <span class="active-task-label">ACTIVE TASK</span>
          <span class="active-task-name" id="active-task-name"
            >— none selected —</span
          >
        </div>

        <!-- Stats row -->
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-value" id="stat-today">0</div>
            <div class="stat-label">TODAY</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">TOTAL</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="stat-streak">0</div>
            <div class="stat-label">STREAK</div>
          </div>
        </div>
      </section>

      <!-- RIGHT: TASK COLUMN -->
      <section class="task-column">
        <div class="task-header">
          <h2 class="task-title">MISSION LOG</h2>
          <span class="task-count" id="task-count">0 tasks</span>
        </div>

        <!-- Add task input -->
        <div class="add-task-row">
          <input
            type="text"
            id="task-input"
            class="task-input"
            placeholder="Add a new task…"
            maxlength="80"
          />
          <button id="add-task-btn" class="add-btn">+</button>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">ALL</button>
          <button class="filter-btn" data-filter="active">ACTIVE</button>
          <button class="filter-btn" data-filter="done">DONE</button>
        </div>

        <!-- Task list -->
        <ul class="task-list" id="task-list">
          <!-- Tasks injected by JS -->
        </ul>

        <div class="task-empty" id="task-empty">
          <div class="empty-icon">◌</div>
          <div class="empty-text">No tasks yet.<br />Add one above.</div>
        </div>
      </section>
    </main>

    <!-- ── SETTINGS MODAL ── -->
    <div class="modal-overlay" id="settings-modal">
      <div class="modal">
        <div class="modal-header">
          <h3>SETTINGS</h3>
          <button class="modal-close" id="settings-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="setting-row">
            <label>Work Duration (min)</label>
            <input
              type="number"
              id="set-work"
              class="setting-input"
              min="1"
              max="60"
              value="25"
            />
          </div>
          <div class="setting-row">
            <label>Short Break (min)</label>
            <input
              type="number"
              id="set-short"
              class="setting-input"
              min="1"
              max="30"
              value="5"
            />
          </div>
          <div class="setting-row">
            <label>Long Break (min)</label>
            <input
              type="number"
              id="set-long"
              class="setting-input"
              min="1"
              max="60"
              value="15"
            />
          </div>
          <div class="setting-row">
            <label>Long Break Every (sessions)</label>
            <input
              type="number"
              id="set-interval"
              class="setting-input"
              min="2"
              max="10"
              value="4"
            />
          </div>
          <div class="setting-row">
            <label>Sound Notifications</label>
            <label class="toggle-switch">
              <input type="checkbox" id="set-sound" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="setting-row">
            <label>Auto-start Breaks</label>
            <label class="toggle-switch">
              <input type="checkbox" id="set-autobreak" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-settings-btn" class="ctrl-btn primary small">
            SAVE SETTINGS
          </button>
        </div>
      </div>
    </div>

    <!-- ── MOTIVATION TOAST ── -->
    <div class="motivation-toast" id="motivation-toast">
      <div class="toast-icon">★</div>
      <div class="toast-content">
        <div class="toast-title">SESSION COMPLETE</div>
        <div class="toast-message" id="toast-message"></div>
      </div>
    </div>

    <!-- ── CONFETTI CANVAS ── -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Edit task modal -->
    <div class="modal-overlay" id="edit-modal">
      <div class="modal small">
        <div class="modal-header">
          <h3>EDIT TASK</h3>
          <button class="modal-close" id="edit-close">✕</button>
        </div>
        <div class="modal-body">
          <input
            type="text"
            id="edit-input"
            class="task-input"
            placeholder="Task name…"
            maxlength="80"
          />
          <div class="setting-row" style="margin-top: 1rem">
            <label>Pomodoros Planned</label>
            <input
              type="number"
              id="edit-pomodoros"
              class="setting-input"
              min="1"
              max="20"
              value="1"
            />
          </div>
        </div>
        <div class="modal-footer">
          <button id="save-edit-btn" class="ctrl-btn primary small">
            SAVE
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
